<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>404 — Page not found</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 2rem; background: #f7f5f1; color: #292b28; font-family: Georgia, 'Times New Roman', serif; }
    main { max-width: 36rem; text-align: center; }
    .code { margin: 0 0 1rem; color: #777d72; font: 600 .8rem/1.4 system-ui, sans-serif; letter-spacing: .25em; }
    h1 { margin: 0; font-size: clamp(2.5rem, 7vw, 4rem); font-weight: 400; line-height: 1.1; }
    p { margin: 1.5rem 0 2rem; color: #62665e; font: 1rem/1.7 system-ui, sans-serif; }
    a { display: inline-block; padding: .95rem 1.6rem; border: 1px solid #485447; background: #485447; color: #fff; font: 600 .9rem/1.3 system-ui, sans-serif; text-decoration: none; transition: background .2s; }
    a:hover { background: #303b30; }
    a:focus-visible { outline: 3px solid #9b7955; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for is no longer available.</p>
    <a href="https://bstudiob.co.uk/">Visit BStudioB</a>
  </main>
</body>
</html>
