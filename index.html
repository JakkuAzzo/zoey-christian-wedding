<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4a0615">
  <meta name="robots" content="noindex, nofollow">
  <title>404 — Page not found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: clamp(24px, 5vw, 64px); background: #380510 url('/assets/forever-background.png') center / cover no-repeat; color: #fff7eb; text-align: center; }
    body::before { content: ''; position: fixed; inset: 0; background: rgba(38, 2, 12, .42); pointer-events: none; }
    main { position: relative; display: grid; justify-items: center; width: min(100%, 650px); padding: clamp(48px, 8vw, 85px) 24px; border: 1px solid rgba(227, 195, 155, .65); background: rgba(48, 4, 16, .7); box-shadow: 0 12px 55px rgba(25, 0, 8, .35); }
    main::before, main::after { content: ''; position: absolute; width: 34px; height: 34px; border-color: #e7c9a3; border-style: solid; pointer-events: none; }
    main::before { top: -6px; left: -6px; border-width: 1px 0 0 1px; }
    main::after { right: -6px; bottom: -6px; border-width: 0 1px 1px 0; }
    .code { margin: 0 0 18px; color: #e4c9a3; font: 600 11px/1.4 Montserrat, sans-serif; letter-spacing: .3em; }
    h1 { margin: 0; font: 400 clamp(43px, 7vw, 70px)/1.05 'Cormorant Garamond', Georgia, serif; }
    .ornament { width: 80px; height: 1px; margin: 25px 0 0; background: #c9a675; position: relative; }
    .ornament::after { content: ''; position: absolute; width: 6px; height: 6px; left: 50%; top: 50%; background: #e4c9a3; transform: translate(-50%, -50%) rotate(45deg); }
    .message { margin: 24px 0 30px; color: #f4e8dc; font: 400 13px/1.8 Montserrat, sans-serif; }
    a { display: inline-block; padding: 15px 23px; border: 1px solid #e4c9a3; color: #fff8ef; font: 600 10px/1.4 Montserrat, sans-serif; letter-spacing: .12em; text-decoration: none; text-transform: uppercase; transition: background-color .2s, color .2s; }
    a:hover { background: #fff8ef; color: #4a0615; }
    a:focus-visible { outline: 3px solid #e4c9a3; outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <div class="ornament" aria-hidden="true"></div>
    <p class="message">The page you're looking for is no longer available.</p>
    <a href="https://bstudiob.co.uk/">Visit BStudioB</a>
  </main>
</body>
</html>
